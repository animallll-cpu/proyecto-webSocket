  <title>WebSocket</title>
 <style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Segoe UI',sans-serif;
background:#a1a7bb;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:10px;
color:#dcddde
}

.container{
width:95%;
max-width:1200px;
height:92vh;
display:flex;
gap:12px
}

.chat-panel,.users-panel{
background:#2b2d31;
border-radius:14px;
overflow:hidden;
display:flex;
flex-direction:column;
box-shadow:0 8px 25px rgba(0,0,0,.35)
}

.chat-panel{flex:3}
.users-panel{flex:1;min-width:220px}

.header,.users-header,.status,.total-users{
background:#232428;
padding:14px;
text-align:center;
border-bottom:1px solid #3a3c43
}

.header h1{font-size:1.2rem;color:#fff}
.header p,.users-header p,.status,.info-text,.total-users{
font-size:.72rem;
color:#aeb4bb
}

.users-header h3{color:#fff;font-size:1rem}

.auth-bar{
background:#2f3136;
padding:10px 14px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
border-bottom:1px solid #3a3c43
}

.user-name{font-size:.85rem}
.user-name span{color:#5865f2;font-weight:600}

.google-btn,.logout-btn,.input-area button{
border:none;
cursor:pointer;
padding:10px 16px;
border-radius:8px;
font-size:.8rem;
transition:.2s;
color:#fff
}

.google-btn,.input-area button{background:#5865f2}
.google-btn:hover,.input-area button:hover{background:#181d4e}

.logout-btn{background:#da373c}
.logout-btn:hover{background:#b52d31}

.messages{
flex:1;
overflow-y:auto;
padding:15px;
background:#313338
}

.msg{margin-bottom:14px}

.msg-user{
font-size:.72rem;
margin-bottom:4px;
color:#aeb4bb
}

.msg-text{
display:inline-block;
max-width:75%;
padding:10px 14px;
border-radius:12px;
background:#383a40;
word-wrap:break-word
}

.my-msg{text-align:right}
.my-msg .msg-text{background:#5865f2;color:#fff}

.notification{
text-align:center;
margin:8px 0
}

.notification span{
background:#232428;
padding:5px 12px;
border-radius:20px;
font-size:.7rem;
color:#b5bac1
}

.input-area{
display:flex;
gap:10px;
padding:14px;
background:#2b2d31;
border-top:1px solid #3a3c43
}

.input-area input{
flex:1;
padding:12px;
border:none;
border-radius:8px;
background:#443d52;
color:#fff;
outline:none
}

.input-area input::placeholder{color:#7d8187}

.users-list{
flex:1;
overflow-y:auto;
padding:10px
}

.user-item{
display:flex;
align-items:center;
gap:10px;
padding:9px;
margin:5px 0;
border-radius:10px;
background:#383a40;
transition:.2s
}

.user-item:hover{background:#44464d}

.user-avatar,.user-avatar img{
width:34px;
height:34px;
border-radius:50%
}

.user-avatar{
background:#5865f2;
display:flex;
align-items:center;
justify-content:center;
font-weight:700;
color:#fff
}

.user-avatar img{object-fit:cover}

.online-indicator{
width:8px;
height:8px;
background:#23a559;
border-radius:50%;
display:inline-block;
margin-right:5px
}

.user-google{color:#23a559;font-size:.65rem}
.user-anonimo{color:#9ca3af;font-size:.65rem}

@media(max-width:700px){
.container{flex-direction:column}
.users-panel{max-height:200px}
}
</style>
</head>

      <p>Chat Colaborativo</p>
    </div>git remote add origin https://github.com/animallll-cpu/proyecto-webSocket.git
    
    <div class="auth-bar" id="authBar">
      <div class="user-name">👤 <span id="nombreUsuario">Cargando...</span></div>
      <div id="authButtons"></div>
    </div>
    
    <div class="messages" id="messages">
      <div class="notification"><span>Conectando al servidor...</span></div>
    </div>
    
    <div class="input-area">
      <input type="text" id="mensajeInput" placeholder="Escribe un mensaje..." disabled>
      <button id="enviarBtn" disabled>📤 Enviar</button>
    </div>
    
    <div class="status" id="status">
      <span class="offline">● Desconectado</span>
    </div>
  </div>
  
  <div class="users-panel">
    <div class="users-header">
      <h3>Usuarios Conectados</h3>
      <p id="totalUsuarios">0 en línea</p>
    </div>
    <div class="users-list" id="usersList">
      <div style="text-align:center; padding:20px; color:#718096;">Esperando conexión...</div>
    </div>
    <div class="total-users">
      <span class="online-indicator"></span> En tiempo real
    </div>
  </div>
</div>

<script>
  let ws = null;
  let miNombre = '';
  let soyGoogle = false;
  
  const messagesDiv = document.getElementById('messages');
  const mensajeInput = document.getElementById('mensajeInput');
  const enviarBtn = document.getElementById('enviarBtn');
  const nombreUsuarioSpan = document.getElementById('nombreUsuario');
  const authButtonsDiv = document.getElementById('authButtons');
  const statusSpan = document.getElementById('status');
  const usersListDiv = document.getElementById('usersList');
  const totalUsuariosSpan = document.getElementById('totalUsuarios');
  
  async function verificarAuth() {
    try {
      const res = await fetch('/api/usuario');
      const user = await res.json();
      if (user) {
        soyGoogle = true;
        miNombre = user.nombre;
        nombreUsuarioSpan.innerHTML = miNombre;
        authButtonsDiv.innerHTML = `<button id="logoutBtn" class="logout-btn">🚪 Salir</button>`;
        
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
          e.preventDefault();
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.close();
          }
          setTimeout(() => {
            window.location.href = '/logout';
          }, 100);
        });
      } else {
        authButtonsDiv.innerHTML = `<a href="/auth/google" class="google-btn">🔐 Iniciar con Google</a>`;
      }
    } catch(e) {
      authButtonsDiv.innerHTML = `<a href="/auth/google" class="google-btn">🔐 Iniciar con Google</a>`;
    }
  }
  
  function actualizarUsuarios(usuarios) {
    if (!usuarios || usuarios.length === 0) {
      usersListDiv.innerHTML = '<div style="text-align:center; padding:20px; color:#718096;">No hay usuarios conectados</div>';
      totalUsuariosSpan.innerHTML = '0 en línea';
      return;
    }
    
    totalUsuariosSpan.innerHTML = `${usuarios.length} en línea`;
    
    usersListDiv.innerHTML = usuarios.map(user => {
      const primeraLetra = user.nombre.charAt(0).toUpperCase();
      const avatarHtml = user.avatar 
        ? `<img src="${user.avatar}" alt="avatar">` 
        : `<div class="user-avatar" style="background: ${user.esGoogle ? '#db4437' : '#667eea'}">${primeraLetra}</div>`;
      
      return `
        <div class="user-item">
          ${avatarHtml}
          <div style="flex:1">
            <div class="user-name">${escapeHtml(user.nombre)}</div>
            <div class="${user.esGoogle ? 'user-google' : 'user-anonimo'}">
              ${user.esGoogle ? '🔐 Google' : '👤 Anónimo'}
            </div>
          </div>
          <span class="online-indicator"></span>
        </div>
      `;
    }).join('');
  }
  
  function agregarMensaje(usuario, mensaje, esPropio = false, hora = '') {
    const div = document.createElement('div');
    div.className = `msg ${esPropio ? 'my-msg' : ''}`;
    div.innerHTML = `
      <div class="msg-user">${escapeHtml(usuario)} ${hora ? '• ' + hora : ''}</div>
      <div class="msg-text">${escapeHtml(mensaje)}</div>
    `;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }
  
  function agregarNotificacion(texto) {
    const div = document.createElement('div');
    div.className = 'notification';
    div.innerHTML = `<span>📢 ${escapeHtml(texto)}</span>`;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }
  
  function escapeHtml(texto) {
    const div = document.createElement('div');
    div.textContent = texto;
    return div.innerHTML;
  }
  
  function limpiarMensajes() {
    messagesDiv.innerHTML = '';
  }
  
  function conectarWebSocket() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.close();
    }
    
    // Detectar automáticamente si es local o remoto
const protocolo = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
const host = window.location.host;
ws = new WebSocket(`${protocolo}//${host}`);
    
    ws.onopen = () => {
      statusSpan.innerHTML = '<span class="online">● Conectado</span>';
      mensajeInput.disabled = false;
      enviarBtn.disabled = false;
      mensajeInput.focus();
    };
    
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      
      switch(data.type) {
        case 'asignacion':
          miNombre = data.nombre;
          nombreUsuarioSpan.innerHTML = miNombre;
          if (!data.esGoogle) {
            agregarNotificacion(`✅ Te has conectado como ${miNombre}`);
          }
          break;
          
        case 'usuarios_conectados':
          actualizarUsuarios(data.usuarios);
          break;
          
        case 'historial':
          if (data.data && data.data.length > 0) {
            limpiarMensajes();
            data.data.forEach(msg => {
              agregarMensaje(msg.usuario_nombre, msg.mensaje, msg.usuario_nombre === miNombre, msg.creado_en);
            });
          } else {
            limpiarMensajes();
            agregarNotificacion('💬 ¡Sé el primero en enviar un mensaje!');
          }
          break;
          
        case 'message':
          const esPropio = data.user === miNombre;
          agregarMensaje(data.user, data.msg, esPropio, data.hora);
          break;
          
        case 'notification':
          agregarNotificacion(data.msg);
          break;
      }
    };
    
    ws.onclose = () => {
      statusSpan.innerHTML = '<span class="offline">● Desconectado</span>';
      mensajeInput.disabled = true;
      enviarBtn.disabled = true;
      if (!window.location.href.includes('logout')) {
        agregarNotificacion('⚠️ Desconectado del servidor. Recargando...');
        setTimeout(() => location.reload(), 3000);
      }
    };
    
    ws.onerror = () => {
      agregarNotificacion('❌ Error de conexión');
    };
  }
  
  function enviarMensaje() {
    const texto = mensajeInput.value.trim();
    if (texto && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(texto);
      mensajeInput.value = '';
    }
  }
  
  enviarBtn.addEventListener('click', enviarMensaje);
  mensajeInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') enviarMensaje();
  });
  
  verificarAuth();
  conectarWebSocket();
</script>
</body>
</html>
